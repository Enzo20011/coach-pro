<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Mi Rutina de Entrenamiento | COACH PRO App</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Student App Stylesheet -->
  <link rel="stylesheet" href="css/alumno.css?v=2.2">
</head>
<body>
  <a class="skip-link" href="#exercisesContainer">Saltar al contenido</a>

  <!-- App Sticky Top Header -->
  <header class="app-header">
    <div class="coach-brand">
      <img src="https://images.unsplash.com/photo-1567013127542-490d757e51fc?q=80&w=150&auto=format&fit=crop" alt="Coach Avatar" class="coach-avatar" id="appCoachAvatar">
      <div class="coach-info">
        <h4>COACH PRO</h4>
        <span id="appCoachName">Tu entrenador</span>
      </div>
    </div>
    <span class="routine-title-pill" id="studentPlanBadge">Coaching 1 a 1</span>
  </header>

  <!-- Greeting & Routine Summary -->
  <section class="student-greeting-box">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;">
      <div>
        <h2 id="studentNameHeader">Hola, Alumno 👋</h2>
        <div class="routine-title-pill" id="routineTitleBadge" style="margin-top: 6px;">
          <i class="fa-solid fa-dumbbell"></i> Plan de Fuerza
        </div>
      </div>
      <button type="button" class="btn-pdf-pill" id="btnStudentPdf" title="Descargar Ficha PDF / Imprimir Rutina">
        <i class="fa-solid fa-file-pdf" style="color: #ff5e57;"></i> Ficha PDF
      </button>
    </div>
  </section>

  <!-- Progress Summary -->
  <section class="progress-summary" id="progressSummary">
    <div class="progress-summary-top">
      <span>Progreso de Hoy</span>
      <span id="progressPercentLabel">0%</span>
    </div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
    </div>
    <div class="progress-summary-sub" id="progressSummarySub">0 de 0 series completadas</div>
  </section>

  <!-- Coach Notes / Technical Cues -->
  <div class="coach-note-alert">
    <i class="fa-solid fa-lightbulb"></i>
    <div>
      <strong style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--accent-cyan);">Indicación del Coach:</strong>
      <span id="coachNotesText">Controlar la cadencia en la fase excéntrica y registrar cargas.</span>
    </div>
  </div>

  <!-- Day Switcher Pills -->
  <nav class="days-nav-scroll" id="daysNavScroll">
    <!-- Populated dynamically via JS -->
  </nav>

  <!-- Dynamic Exercises Container -->
  <main class="exercises-container" id="exercisesContainer">
    <!-- Populated dynamically via JS -->
  </main>

  <!-- Floating Rest Timer Widget -->
  <div class="floating-timer-bar" id="floatingTimerBar">
    <div class="timer-label">
      <i class="fa-solid fa-stopwatch"></i> Descanso:
    </div>
    <div class="timer-digits" id="timerDigits">01:30</div>
    <div class="timer-controls">
      <button type="button" class="timer-btn" id="btnAdd30s" title="Añadir 30 segundos">+30s</button>
      <button type="button" class="timer-btn" id="btnCloseTimer" title="Cerrar">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <!-- App Fixed Bottom Bar -->
  <div class="app-bottom-bar">
    <button type="button" class="app-action-btn finish" id="btnCompleteWorkout">
      <i class="fa-solid fa-circle-check"></i> Terminar Entrenamiento
    </button>
    <a href="#" class="app-action-btn whatsapp" id="coachWhatsAppBtn" target="_blank" rel="noopener noreferrer" title="Consultar al Coach por WhatsApp">
      <i class="fa-brands fa-whatsapp"></i>
    </a>
  </div>

  <!-- Firebase (shared cloud database) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <!-- Student App Logic -->
  <script src="js/alumno.js?v=2.3"></script>
</body>
</html>
